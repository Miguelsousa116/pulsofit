<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulsoFit - Elite Workout</title>
    <style>
        :root {
            --bg-color: #0e131f;
            --card-bg: #162032;
            --accent-lime: #c6ff00;
            --accent-cyan: #00e5ff;
            --text-main: #ffffff;
            --text-muted: #8c9bae;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 110px; }

        /* Topo do Perfil Estilo App Profissional */
        .top-header {
            background: linear-gradient(180deg, #162032 0%, #0e131f 100%);
            padding: 20px 16px;
            border-bottom: 1px solid #1f2d42;
        }
        .user-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .user-title { font-size: 1.3rem; font-weight: 700; color: var(--text-main); }
        .stats-badge { background: rgba(198, 255, 0, 0.1); color: var(--accent-lime); font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; }
        
        /* Dias de Treino */
        .days-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0 12px 0;
        }
        .day-chip {
            background: #1f2d42;
            border: none;
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .day-chip.active {
            background: var(--accent-lime);
            color: #000;
            font-weight: bold;
        }

        .container { padding: 16px; max-width: 600px; margin: 0 auto; }
        .app-section { display: none; }
        .app-section.active { display: block; }

        /* Cartão de Exercício Estilo Referência */
        .exercise-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #1f2d42;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .ex-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .ex-name { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
        .ex-muscles { font-size: 0.75rem; color: var(--accent-cyan); background: rgba(0, 229, 255, 0.1); padding: 3px 8px; border-radius: 6px; }
        .ex-note { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 14px; }

        /* Círculos de Métricas (Repetições / Descanso) */
        .metrics-row {
            display: flex;
            justify-content: space-around;
            margin-bottom: 16px;
            background: #0f1522;
            padding: 12px;
            border-radius: 12px;
        }
        .metric-circle {
            text-align: center;
        }
        .circle-value {
            width: 50px;
            height: 50px;
            border: 2px solid var(--accent-lime);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--accent-lime);
            margin: 0 auto 4px auto;
        }
        .metric-label { font-size: 0.7rem; color: var(--text-muted); }

        /* Grelha de Séries Estilo App Real */
        .series-table-title { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
        .series-row-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111827;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.85rem;
            border: 1px solid #1f2d42;
        }
        .series-row-item span { color: var(--text-muted); }
        .series-row-item strong { color: var(--text-main); }

        /* Botão de Registar Série */
        .btn-register {
            width: 100%;
            background: var(--accent-lime);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Menu Inferior Fixo Exclusivo */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 16px;
            right: 16px;
            background: #162032;
            border: 1px solid #1f2d42;
            border-radius: 16px;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            z-index: 1000;
        }
        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            text-align: center;
            cursor: pointer;
        }
        .nav-item.active { color: var(--accent-lime); font-weight: bold; }
        
        .info-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #1f2d42;
        }
        .info-card h3 { color: var(--accent-lime); margin-bottom: 6px; font-size: 1rem; }
        .info-card p { font-size: 0.85rem; color: var(--text-muted); }
    </style>
</head>
<body>

    <!-- Topo Estilo App de Alta Performance -->
    <div class="top-header">
        <div class="user-row">
            <div class="user-title">Paulo Miguel</div>
            <div class="stats-badge">3 de 4 treinos</div>
        </div>
        <!-- Abas dos Dias -->
        <div class="days-container" id="days-nav-container"></div>
    </div>

    <div class="container">
        
        <!-- SECÇÃO DE TREINOS -->
        <div id="sec-treinos" class="app-section active">
            <div id="exercises-wrapper"></div>
        </div>

        <!-- SECÇÃO DE NUTRIÇÃO -->
        <div id="sec-nutricao" class="app-section">
            <div class="info-card">
                <h3>Dieta de Hipertrofia</h3>
                <p>Foco em excedente calórico limpo para ganho de massa muscular de qualidade.</p>
            </div>
            <div class="info-card">
                <h3>Refeição Principal</h3>
                <p>200g de Arroz, 150g de Frango e Azeite virgem extra.</p>
            </div>
        </div>

        <!-- SECÇÃO DE EVOLUÇÃO -->
        <div id="sec-evolucao" class="app-section">
            <div class="info-card">
                <h3>Estatísticas de Carga</h3>
                <p>Progressão linear ativa em todos os exercícios principais da semana.</p>
            </div>
        </div>

    </div>

    <!-- Menu Inferior -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="trocarAba('treinos', this)">🏠<br>Início</button>
        <button class="nav-item" onclick="trocarAba('treinos', this)">💪<br>Treinos</button>
        <button class="nav-item" onclick="trocarAba('nutricao', this)">🥗<br>Nutrição</button>
        <button class="nav-item" onclick="trocarAba('evolucao', this)">📈<br>Evolução</button>
    </div>

    <script>
        const workoutPlan = {
            "Dia 1": {
                title: "Peito e Ombros",
                exercises: [
                    { name: "Supino Reto com Halteres", target: "Peito • Tríceps", note: "Aumentar a carga gradualmente nas séries finais.", reps: "8-10", rest: "2:00", sets: ["S1 (Aquecimento): 15-20 reps", "S2: 10-12 reps", "S3: 8-10 reps", "S4: 8 reps"] },
                    { name: "Desenvolvimento Militar", target: "Ombros • Core", note: "Manter o tronco firme e controlado.", reps: "10-12", rest: "1:30", sets: ["S1: 12 reps", "S2: 10 reps", "S3: 8-10 reps"] }
                ]
            },
            "Dia 2": {
                title: "Costas e Bíceps",
                exercises: [
                    { name: "Puxada Vertical Aberta", target: "Dorsal • Bíceps", note: "Puxar com os cotovelos em direção ao corpo.", reps: "10-12", rest: "1:30", sets: ["S1: 15 reps", "S2: 12 reps", "S3: 10 reps", "S4: 8 reps"] },
                    { name: "Remada Curvada com Barra", target: "Costas • Lombar", note: "Coluna neutra e tronco inclinado a 45º.", reps: "8-10", rest: "2:00", sets: ["S1: 12 reps", "S2: 10 reps", "S3: 8 reps"] }
                ]
            },
            "Dia 3": {
                title: "Pernas Completo",
                exercises: [
                    { name: "Agachamento Livre", target: "Quadríceps • Glúteos", note: "Amplitude completa com foco na descida.", reps: "8-10", rest: "2:30", sets: ["S1: 15 reps", "S2: 10 reps", "S3: 8 reps", "S4: 6 reps"] },
                    { name: "Leg Press 45º", target: "Quadríceps", note: "Posicionamento firme dos pés na plataforma.", reps: "10-12", rest: "1:30", sets: ["S1: 12 reps", "S2: 12 reps", "S3: 10 reps"] }
                ]
            },
            "Dia 4": {
                title: "Braços e Abdómen",
                exercises: [
                    { name: "Rosca Direta com Barra", target: "Bíceps", note: "Evitar balançar o corpo durante o movimento.", reps: "10-12", rest: "1:30", sets: ["S1: 12 reps", "S2: 10 reps", "S3: 10 reps", "S4: 8 reps"] },
                    { name: "Tríceps Testa", target: "Tríceps", note: "Isolar o movimento apenas nos cotovelos.", reps: "10-12", rest: "1:30", sets: ["S1: 12 reps", "S2: 10 reps", "S3: 10 reps"] }
                ]
            }
        };

        let activeDay = "Dia 1";

        function renderWorkout() {
            const daysNav = document.getElementById("days-nav-container");
            const wrapper = document.getElementById("exercises-wrapper");
            
            daysNav.innerHTML = "";
            wrapper.innerHTML = "";

            // Renderizar botões de dias no topo
            Object.keys(workoutPlan).forEach(day => {
                const btn = document.createElement("button");
                btn.className = `day-chip ${day === activeDay ? 'active' : ''}`;
                btn.innerText = `${day}: ${workoutPlan[day].title}`;
                btn.onclick = () => {
                    activeDay = day;
                    renderWorkout();
                };
                daysNav.appendChild(btn);
            });

            // Renderizar exercícios do dia ativo com os círculos e grelhas de séries
            workoutPlan[activeDay].exercises.forEach((ex, index) => {
                let seriesListHtml = ex.sets.map((setInfo, sIdx) => `
                    <div class="series-row-item">
                        <span>Conjunto ${sIdx + 1}</span>
                        <strong>${setInfo}</strong>
                    </div>
                `).join('');

                const card = document.createElement("div");
                card.className = "exercise-card";
                card.innerHTML = `
                    <div class="ex-header">
                        <span class="ex-name">${ex.name}</span>
                        <span class="ex-muscles">${ex.target}</span>
                    </div>
                    <div class="ex-note">${ex.note}</div>
                    
                    <div class="metrics-row">
                        <div class="metric-circle">
                            <div class="circle-value">${ex.reps}</div>
                            <div class="metric-label">Repetições</div>
                        </div>
                        <div class="metric-circle">
                            <div class="circle-value">${ex.rest}</div>
                            <div class="circle-label">Descanso</div>
                        </div>
                        <div class="metric-circle">
                            <div class="circle-value">0/${ex.sets.length}</div>
                            <div class="metric-label">Feitos</div>
                        </div>
                    </div>

                    <div class="series-table-title">Registo de Séries</div>
                    ${seriesListHtml}
                    
                    <button class="btn-register" onclick="alert('Série registada com sucesso!')">Registar Série</button>
                `;
                wrapper.appendChild(card);
            });
        }

        function trocarAba(secName, btnElement) {
            document.querySelectorAll('.app-section').forEach(sec => sec.classList.remove('active'));
            document.getElementById('sec-' + secName).classList.add('active');

            document.querySelectorAll('.bottom-nav .nav-item').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
        }

        renderWorkout();
    </script>
</body>
</html>
